- aid: hku:scholars-hub-oai
  name: HKU Scholars Hub OAI-PMH
  description: >-
    HKU Scholars Hub is the University's DSpace-based open-access institutional repository and current
    research information system, on HKU's own host. It is documented as exposing an OAI-PMH metadata interface
    at https://hub.hku.hk/oai/request. Every automated probe on 2026-08-19 — verb=Identify, /server/api,
    /rest/ — returned HTTP 403 behind a Cloudflare managed challenge, including with a browser User-Agent.
    The surface is live and institution-hosted but unreadable to machines as deployed, so no OAI-PMH conformance
    is credited.
  humanURL: https://hub.hku.hk/
