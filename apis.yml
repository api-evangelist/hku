apis:
- aid: hku:identity-federation
  name: HKU Shibboleth Identity Provider
  description: >-
    The University of Hong Kong's own Shibboleth SAML 2.0 identity provider, entityID https://hkafidp.hku.hk/idp/shibboleth,
    scope hku.hk. It self-publishes signed metadata (HTTP 200, application/xml, 14,831 bytes) declaring
    SAML 1.1 and SAML 2.0 SSO, single logout, artifact resolution and attribute query endpoints, transient
    NameIDs, and the eduPerson and SCHAC attributes it releases. Registered by the Hong Kong Access Federation
    (JUCC) on 2016-12-15 and exported to eduGAIN, carrying the REFEDS Research and Scholarship entity
    category and SIRTFI assurance certification. This is HKU's most substantial institution-operated machine-readable
    surface and the one no catalog had recorded.
  humanURL: https://www.hkaf.edu.hk/
  baseURL: https://hkafidp.hku.hk/idp/shibboleth
