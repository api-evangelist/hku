x-coverage:
  state: gated
  reason: affiliation_gated_developer_portal
  detail: >-
    HKU operates real APIs and a real gateway, but the only route to their contracts is an
    institutional sign-in. developer.hku.hk returns 200 on every route and redirects all of them
    to /signin; api.hku.hk answers with the Azure API Management 404 envelope on every
    unauthenticated path. What is publicly readable is identity infrastructure — a Shibboleth SAML
    IdP and an AD FS OIDC issuer, both on HKU hosts, both machine-readable, both catalogued here.
    Two further surfaces are blocked rather than absent: hub.hku.hk (DSpace/OAI-PMH) sits behind a
    Cloudflare challenge, and datahub.hku.hk (Figshare tenancy) returns an empty 202 to machine
    clients. No fabrication was needed to fill the gap and none was performed.
  assessed: '2026-08-19'
  method: probed
