    research information system (CRIS), collecting and disseminating HKU research outputs. It exposes
    an OAI-PMH metadata-harvesting interface for programmatic harvesting of repository metadata.
  humanURL: https://hub.hku.hk/
  baseURL: https://hub.hku.hk/oai/request
