aid: hku
name: University of Hong Kong
description: >-
  The University of Hong Kong (HKU) is a public research university in Hong Kong SAR, founded in
  1911 and ranked in the top 30 of the QS World University Rankings. It operates no public,
  self-serve API programme. The machine-readable surfaces HKU genuinely runs on its own hosts are
  identity infrastructure: a Shibboleth SAML 2.0 identity provider at hkafidp.hku.hk, registered
  with the Hong Kong Access Federation in 2016 and exported to eduGAIN with REFEDS Research and
  Scholarship and SIRTFI declarations, and an AD FS OAuth 2.0 / OpenID Connect issuer at
  adfs.hku.hk publishing a live discovery document and JWKS. HKU ITS also runs an Azure API
  Management gateway (api.hku.hk) and developer portal (developer.hku.hk) that opened GenAI
  chat-completion, embedding and image-generation APIs to students in March 2026 — but every
  portal route redirects to institutional sign-in, so no specification, scope or endpoint list is
  publicly readable. Its research repository is a Figshare tenancy and its library discovery is an
  Ex Libris Primo tenancy: real institutional facts, vendor-operated contracts, recorded here as
  tenant relationships rather than credited to HKU. HKU publishes no OpenAPI, no robots.txt on its
  main host, no llms.txt, no status page and no API changelog.
type: Index
