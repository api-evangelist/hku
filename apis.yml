- aid: hku:its-api-portal
  name: HKU ITS API Developer Portal and Gateway
  description: >-
    HKU Information Technology Services runs an Azure API Management gateway at api.hku.hk and a developer
    portal at developer.hku.hk. Since 17 March 2026 the portal has issued subscription keys to students
    as well as staff for chat-completion, embedding and image-generation APIs across several hosted models.
    The gateway is live and answers in the APIM error envelope ({"statusCode":404,"message":"Resource
    not found"}), but every portal route — /apis, /docs/services — redirects to /signin, so the API catalog,
    its specifications, its scopes and its rate limits are not publicly enumerable. Catalogued as a real
    institution-operated surface whose contract is not published, not as an absence.
  humanURL: https://developer.hku.hk/
  baseURL: https://api.hku.hk
  tags:
  - Developer Portal
