- aid: hku:datahub-figshare
  name: HKU DataHub (Figshare tenancy)
  description: >-
    HKU DataHub is the University's research-data repository, running as a Figshare tenancy — datahub.hku.hk
    is a CNAME to figshare.com and the same content is served at hku.figshare.com. The data, the collections
    and the DOIs are HKU's; the API contract behind them is Figshare's generic api.figshare.com/v2 and
    belongs to Figshare's own profile. Recorded here as a tenant relationship only. The eleven Figshare-derived
    "HKU" API entries this repo carried before 2026-08-19 — altmetric, articles, authors, collections,
    institutions, oauth, other, profiles, projects, symplectic — were one vendor document counted eleven
    times and have been removed.
  humanURL: https://datahub.hku.hk/
  baseURL: https://datahub.hku.hk/
