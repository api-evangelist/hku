  - date: '2026-08-19'
    rating: 3
    summary: >-
      Re-profiled under the university pipeline, operator-first. Removed the Figshare attribution:
      the eleven "HKU" APIs this profile carried were one vendor specification split by tag, and
      HKU DataHub is now recorded as a Figshare tenancy rather than an HKU contract. In its place,
      two genuinely institution-operated machine-readable surfaces were found and verified, neither
      previously catalogued anywhere: a Shibboleth SAML 2.0 identity provider at hkafidp.hku.hk
      (200, signed metadata, scope hku.hk, registered by the Hong Kong Access Federation on
      2016-12-15, present in the eduGAIN aggregate with REFEDS Research & Scholarship and SIRTFI),
      and an AD FS OAuth 2.0 / OpenID Connect issuer at adfs.hku.hk (200 discovery, 200 JWKS, 401
      UserInfo, 405 device-code, 200 signed WS-Fed metadata). HKU ITS also runs a live Azure API
      Management gateway at api.hku.hk with GenAI APIs opened to students in March 2026, but the
      portal redirects every route to institutional sign-in, so no contract is publicly readable.
      hub.hku.hk (DSpace / OAI-PMH) is Cloudflare-blocked to machines and datahub.hku.hk returns an
      empty 202 — both blocked rather than absent. Access posture corrected from "self-serve" to
      affiliation-gated. Expect the composite to fall; it was previously carrying Figshare's
      engineering.
