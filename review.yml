      institutional repository (hub.hku.hk, documented as DSpace with OAI-PMH at
      /oai/request) returned HTTP 403 to automated probes, consistent with bot/WAF
      blocking rather than absence; treated as documented-but-unverified-live. No
      fabricated endpoints: only URLs confirmed via web search and direct HTTP checks
      are cataloged.
