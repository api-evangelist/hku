x-operator: institution
name: HKU Identity Attribute Vocabulary
description: >-
  The attribute vocabulary the University of Hong Kong actually asserts about its people, read
  from the RequestedAttribute / saml:Attribute declarations in HKU's own published SAML metadata
  and from claims_supported in HKU's OpenID Connect discovery document. This is the only published
  data vocabulary found on an HKU-operated host: it is eduPerson and SCHAC, the standard
  research-and-education schemas, not an HKU invention.
schemas:
- name: eduPerson / SCHAC (SAML, hkafidp.hku.hk)
  namespace: urn:oasis:names:tc:SAML:2.0:attrname-format:uri
  terms:
  - name: eduPersonPrincipalName
    oid: urn:oid:1.3.6.1.4.1.5923.1.1.1.6
    description: Scoped principal name, scope hku.hk.
  - name: eduPersonScopedAffiliation
    oid: urn:oid:1.3.6.1.4.1.5923.1.1.1.9
    description: Affiliation scoped to hku.hk (student, faculty, staff, member, affiliate).
  - name: eduPersonAffiliation
    oid: urn:oid:1.3.6.1.4.1.5923.1.1.1.1
    description: Unscoped affiliation with the institution.
  - name: eduPersonEntitlement
    oid: urn:oid:1.3.6.1.4.1.5923.1.1.1.7
    description: URI-valued entitlements used for resource authorization.
  - name: eduPersonTargetedID
    oid: urn:oid:1.3.6.1.4.1.5923.1.1.1.10
