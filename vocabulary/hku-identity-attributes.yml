privacyPosture:
  nameIdFormat: urn:oasis:names:tc:SAML:2.0:nameid-format:transient
  subjectType: pairwise
  note: >-
    Both HKU identity surfaces default to non-correlatable subject identifiers — transient SAML
    NameIDs and pairwise OIDC subjects. That is a deliberate privacy choice and it is the reason
    eduPersonTargetedID is present as the persistent alternative.
